<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI_explan</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="ai-explan-sidebar-container">
    <div id="ai-explan-sidebar-header">
      <h3>AI_explan</h3>
      <button id="ai-explan-close-btn" class="close-btn">&times;</button>
    </div>
    <div id="ai-explan-content">
      <div id="ai-explan-term-section">
        <h4>Term:</h4>
        <p id="selected-term">Loading...</p>
      </div>
      <div id="ai-explan-explanation-section">
        <h4>Explanation:</h4>
        <div id="ai-explan-result">Processing your request...</div>
      </div>
      <div id="ai-explan-context-section">
        <h4>Context:</h4>
        <div id="explanation-context">Loading context...</div>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
